server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Comprime HTML, JS, CSS y SVG para que cargue más rápido
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Los recursos (JS, CSS, imágenes) se pueden guardar en caché;
    # el HTML no, para que siempre se vea la última versión.
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
