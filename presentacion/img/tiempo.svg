<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 520 736" role="img" aria-label="Árbol de llamadas de Path: el nivel i tiene a a la i llamadas, con a igual a 2 a la n más 1; domina el último nivel">
  <rect x="50" y="22" width="420" height="50" rx="16" fill="url(#g-ink)" filter="url(#ds)" />
  <foreignObject x="0.0" y="29.9" width="520" height="34.2"><div xmlns="http://www.w3.org/1999/xhtml" class="fo t-white" style="font-size:18px;font-weight:650;justify-content:center;height:34.2px">Cada llamada hace a lo más \(a = 2^{n+1}\) llamadas</div></foreignObject>
  <foreignObject x="50.0" y="89.8" width="520" height="28.5"><div xmlns="http://www.w3.org/1999/xhtml" class="fo t-muted" style="font-size:15px;font-weight:600;justify-content:flex-start;height:28.5px">NIVEL</div></foreignObject>
  <foreignObject x="190.0" y="89.8" width="520" height="28.5"><div xmlns="http://www.w3.org/1999/xhtml" class="fo t-muted" style="font-size:15px;font-weight:600;justify-content:flex-start;height:28.5px">LLAMADAS</div></foreignObject>
  <foreignObject x="50.0" y="119.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:650;justify-content:flex-start;height:41.8px">\(L = 2^n\)</div></foreignObject>
  <rect x="190" y="120" width="30" height="40" rx="12" fill="url(#g-blue)" />
  <foreignObject x="234.0" y="119.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:700;justify-content:flex-start;height:41.8px">\(1\)</div></foreignObject>
  <foreignObject x="50.0" y="211.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:650;justify-content:flex-start;height:41.8px">\(L = 2^{n-1}\)</div></foreignObject>
  <rect x="190" y="212" width="80" height="40" rx="12" fill="url(#g-blue)" />
  <foreignObject x="284.0" y="211.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:700;justify-content:flex-start;height:41.8px">\(a\)</div></foreignObject>
  <foreignObject x="50.0" y="303.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:650;justify-content:flex-start;height:41.8px">\(L = 2^{n-2}\)</div></foreignObject>
  <rect x="190" y="304" width="150" height="40" rx="12" fill="url(#g-blue)" />
  <foreignObject x="354.0" y="303.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:700;justify-content:flex-start;height:41.8px">\(a^2\)</div></foreignObject>
  <foreignObject x="50.0" y="459.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:650;justify-content:flex-start;height:41.8px">\(L = 1\)</div></foreignObject>
  <rect x="190" y="460" width="240" height="40" rx="12" fill="url(#g-ink)" filter="url(#ds)" />
  <foreignObject x="444.0" y="459.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:700;justify-content:flex-start;height:41.8px">\(a^n\)</div></foreignObject>
  <foreignObject x="204.0" y="377.3" width="520" height="49.4"><div xmlns="http://www.w3.org/1999/xhtml" class="fo t-muted" style="font-size:26px;font-weight:700;justify-content:flex-start;height:49.4px">\(\vdots\)</div></foreignObject>
  <rect class="glass" x="50" y="548" width="420" height="82" rx="20" />
  <foreignObject x="0.0" y="559.8" width="520" height="28.5"><div xmlns="http://www.w3.org/1999/xhtml" class="fo t-muted" style="font-size:15px;font-weight:600;justify-content:center;height:28.5px">SUMA DE TODOS LOS NIVELES</div></foreignObject>
  <foreignObject x="0.0" y="584.2" width="520" height="45.6"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:24px;font-weight:650;justify-content:center;height:45.6px">\(1 + a + \cdots + a^n \le 2a^n\)</div></foreignObject>
  <rect class="glass" x="50" y="660" width="420" height="58" rx="18" stroke="#1b2430" stroke-width="2.5" />
  <foreignObject x="0.0" y="668.1" width="520" height="41.8"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:22px;font-weight:650;justify-content:center;height:41.8px">\(N(2^n) \le 2^{n(n+1)+1} = 2^{O(n^2)}\)</div></foreignObject>
  </svg>
